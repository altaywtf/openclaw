name: macOS approval queue probe

on:
  push:
    branches: [codex/pr-128175-queue-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-approval-queue-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native probe inputs
        shell: bash
        run: |
          set -euo pipefail
          baseline=66fa0bd2be4f811a6c6dbee8bd5dd102dae8e544
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --quiet "$baseline" HEAD -- . \
            ':(exclude).github/workflows/macos-approval-queue-probe.yml' \
            ':(exclude)apps/macos/Tests/OpenClawIPCTests/ExecApprovalQueueStoreTests.swift'
          test -z "$(git status --porcelain)"
          test "$(uname -s)" = Darwin
          test ! -d "$HOME/.openclaw"
          if pgrep -x OpenClaw >/dev/null; then
            echo "Refusing to run beside an existing app." >&2
            exit 1
          fi
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          sw_vers
          xcodebuild -version
          swift --version

      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: "off"
          install-bun: "false"
          install-deps: "true"

      - name: Prepare native test resources
        run: node scripts/prepare-apple-mermaid.mjs

      - name: Build the changed native test graph
        run: swift build --package-path apps/macos --build-system native --build-tests

      - name: Observe queue startup and reconnect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/queue-probe
          logical_cpu="$(sysctl -n hw.logicalcpu)"
          [[ "$logical_cpu" =~ ^[1-9][0-9]*$ ]]
          swift_test_width=$(( logical_cpu < 12 ? logical_cpu : 12 ))
          node scripts/test-macos-native.mts default \
            --package-path apps/macos --build-system native --skip-build \
            --experimental-maximum-parallelization-width "$swift_test_width" \
            --filter ExecApprovalQueueStoreTests 2>&1 | tee .artifacts/queue-probe/native-tests.log

      - name: Retain synthetic queue observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-approval-queue-probe
          path: .artifacts/queue-probe
          if-no-files-found: warn
          retention-days: 7
