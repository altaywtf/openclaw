name: Declaration cache diagnostic

on:
  push:
    branches:
      - diagnostic/declaration-cache-verification-20260904

permissions:
  contents: read

concurrency:
  group: declaration-cache-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      EXPECTED_SHA: c0403dbf4945955156de5ea0069062cc939a6502
    steps:
      - name: Checkout diagnostic tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ env.EXPECTED_SHA }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1

      - name: Setup isolated pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_root="$RUNNER_TEMP/openclaw-declaration-cache/pnpm"
          npm_config_cache="$RUNNER_TEMP/openclaw-declaration-cache/npm-cache" \
            npm install --global --prefix "$pnpm_root" pnpm@12.1.0
          echo "$pnpm_root/bin" >> "$GITHUB_PATH"

      - name: Run cold and warm builds
        shell: bash
        working-directory: source
        env:
          OPENCLAW_DECLARATION_CACHE_EVIDENCE_DIR: ${{ runner.temp }}/openclaw-declaration-cache-evidence
          OPENCLAW_DECLARATION_CACHE_SCRATCH_SOURCE: ${{ runner.temp }}/openclaw-declaration-cache/source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node ../tooling/scripts/declaration-cache-diagnostic.mjs run "$EXPECTED_SHA"

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: declaration-cache-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/openclaw-declaration-cache-evidence/summary.json
          if-no-files-found: error
          retention-days: 3
