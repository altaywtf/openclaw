name: macOS local auth proof

on:
  push:
    branches: [codex/pr-128175-native-proof]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-local-auth-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native execution boundary
        shell: bash
        run: |
          set -euo pipefail
          baseline=606d9ab82afdb28ebaad33896e41811b96ad87c7
          git merge-base --is-ancestor "$baseline" HEAD
          git diff --quiet "$baseline" HEAD -- . \
            ':(exclude).github/workflows/macos-local-auth-proof.yml' \
            ':(exclude)scripts/e2e/macos-local-auth-proof.mts' \
            ':(exclude)scripts/e2e/fixtures/macos-local-auth-proof/candidate.patch' \
            ':(exclude)scripts/e2e/fixtures/macos-local-auth-proof/candidate.commit'
          git diff --quiet HEAD --
          test "$(uname -s)" = Darwin
          launchctl print "gui/$(id -u)" >/dev/null
          test ! -d "$HOME/.openclaw"
          if pgrep -x OpenClaw >/dev/null; then
            echo "Refusing to run beside an existing app." >&2
            exit 1
          fi
          sw_vers
          xcodebuild -version

      - name: Check out the pinned repair base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2998a3350f22a50850adfc72cee44f453570fae1
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize and verify the unpublished candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2998a3350f22a50850adfc72cee44f453570fae1
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin 4e35b1caf03687853b8cc9dd47f8d5c6ea81bb93
          fixture="$GITHUB_WORKSPACE/scripts/e2e/fixtures/macos-local-auth-proof"
          git apply --index --unidiff-zero "$fixture/candidate.patch"
          test "$(git write-tree)" = ad916b6f775b546d25d1bb6b8f6b1534a9aad5bc
          test "$(git hash-object -t commit -w "$fixture/candidate.commit")" = 23b805fa3821e06e882d846843d96da2252a91bd
          git checkout --detach 23b805fa3821e06e882d846843d96da2252a91bd
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 4e35b1caf03687853b8cc9dd47f8d5c6ea81bb93 HEAD
          git diff --quiet 2998a3350f22a50850adfc72cee44f453570fae1 HEAD -- . \
            ':(exclude)apps/macos/Sources/OpenClaw/GatewayEndpointStore.swift' \
            ':(exclude)apps/macos/Tests/OpenClawIPCTests/GatewayEndpointStoreTests.swift'

      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: "off"
          install-bun: "false"
          install-deps: "false"

      - name: Verify candidate attribution before execution
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          signers="$RUNNER_TEMP/native-auth-allowed-signers"
          curl --fail --silent --show-error https://api.github.com/users/obviyus/ssh_signing_keys |
            node -e 'const fs = require("node:fs"); const keys = JSON.parse(fs.readFileSync(0, "utf8")); if (!Array.isArray(keys) || keys.length === 0) throw new Error("No registered signing keys"); for (const {key} of keys) { if (typeof key !== "string" || /[\r\n]/.test(key)) throw new Error("Invalid signing key"); console.log("hi@obviy.us " + key); }' > "$signers"
          git -c gpg.ssh.allowedSignersFile="$signers" verify-commit 23b805fa3821e06e882d846843d96da2252a91bd
          # Attribution does not promote contributor code out of this secretless runner.

      - name: Activate the candidate package-manager pin
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          package-manager-file: candidate/package.json
          lockfile-path: candidate/pnpm-lock.yaml
          cache-mode: "off"

      - name: Install candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Build the actual ad-hoc app
        working-directory: candidate
        shell: bash
        env:
          BUILD_CONFIG: debug
          SKIP_PNPM_INSTALL: "1"
          OPENCLAW_SKIP_MLX_TTS: "1"
          SIGN_IDENTITY: "-"
          SKIP_TEAM_ID_CHECK: "1"
          CODESIGN_TIMESTAMP: "off"
        run: bash scripts/package-mac-app.sh

      - name: Archive the verified native app
        shell: bash
        run: tar -czf "$RUNNER_TEMP/native-auth-app.tar.gz" -C candidate/dist OpenClaw.app

      - name: Retain the app before fixture setup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-auth-app-23b805fa3821e06e882d846843d96da2252a91bd
          path: ${{ runner.temp }}/native-auth-app.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Observe fresh local auth connections
        shell: bash
        run: node scripts/e2e/macos-local-auth-proof.mts candidate

      - name: Run candidate endpoint regression tests
        working-directory: candidate/apps/macos
        run: |
          swift build --build-tests
          node "$GITHUB_WORKSPACE/scripts/test-macos-native.mts" default --skip-build --filter GatewayEndpointStoreTests

      - name: Retain synthetic native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-local-auth-proof
          path: .artifacts/macos-local-auth-proof
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
