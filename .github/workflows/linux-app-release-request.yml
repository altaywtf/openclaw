name: Linux App Release Request

run-name: Linux App Release Request [${{ inputs.tag }}] desktop=${{ inputs['desktop-test-bundles'] }}${{ inputs.expected_sha && format(' source={0} parent={1}:{2}', inputs.expected_sha, inputs.release_publish_run_id, inputs.release_publish_run_attempt) || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OpenClaw release tag to receive Linux companion bundles, for example v2026.7.1
        required: true
        type: string
      desktop-test-bundles:
        description: Also build unsigned macOS/Windows test bundles
        default: false
        type: boolean
      expected_sha:
        description: Exact release source for an automated parent handoff (omit for manual recovery)
        type: string
      release_publish_run_id:
        description: Original release publication run for automated request reconciliation
        type: string
      release_publish_run_attempt:
        description: Exact original release publication attempt
        type: string

permissions: {}

concurrency:
  group: linux-app-release-request-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate_request:
    name: Validate release request
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Validate tag input format
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PARENT_RUN_ID: ${{ inputs.release_publish_run_id }}
          PARENT_RUN_ATTEMPT: ${{ inputs.release_publish_run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*(-[1-9][0-9]*)?$ ]]; then
            echo "Linux bundles ship for stable release tags only (vYYYY.M.PATCH or vYYYY.M.PATCH-N); got: ${RELEASE_TAG}"
            exit 1
          fi
          if [[ -n "${EXPECTED_SHA}${PARENT_RUN_ID}${PARENT_RUN_ATTEMPT}" ]] &&
             [[ ! "${EXPECTED_SHA}" =~ ^[a-f0-9]{40}$ || ! "${PARENT_RUN_ID}" =~ ^[1-9][0-9]*$ || ! "${PARENT_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Automated requests require an exact source SHA, parent run ID and attempt." >&2
            exit 1
          fi
